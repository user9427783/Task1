<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Profiles</title>
  <style>
    /* General Body Styling */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #ff7e5f, #feb47b); /* Beautiful gradient */
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }

    /* Header Section */
    header {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 3.5em;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Container Styling */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Flexible layout */
      gap: 30px;
      padding: 40px;
      justify-items: center;
    }

    /* Profile Card Styling */
    .profile-card {
      background: #fff;
      color: #333;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      max-width: 320px;
    }

    .profile-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 4px solid #feb47b;
      transition: border-color 0.3s ease;
    }

    .profile-card img:hover {
      border-color: #ff7e5f;
    }

    .profile-card h3 {
      font-size: 1.8em;
      margin-bottom: 10px;
      color: #ff7e5f;
    }

    .profile-card p {
      font-size: 1.1em;
      margin: 5px 0;
    }

    /* Mobile & Tablet Responsiveness */
    @media screen and (max-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media screen and (max-width: 480px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Footer Section */
    footer {
      background: #333;
      color: #fff;
      padding: 20px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
    }

    footer p {
      margin: 0;
      font-size: 1.1em;
    }
  </style>
</head>
